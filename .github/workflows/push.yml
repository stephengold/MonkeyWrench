---
# GitHub Actions workflow for commits pushed to the MonkeyWrench repo - all branches

name: CI at GitHub
on: [push]

jobs:
  Java17-MacOSX64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macos-26-intel
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build install javadoc TestIssue5253 --console=plain --stacktrace

  Java21-Linux64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          ./gradlew build install javadoc TestIssue5253 \
            --console=plain \
            -PsigningKeyEncoded='${{ secrets.SIGNING_KEY_ENCODED }}' \
            -PsigningPassword='${{ secrets.SIGNING_PASSWORD }}'
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./gradlew clean release \
            --console=plain \
            -PsigningKeyEncoded='${{ secrets.SIGNING_KEY_ENCODED }}' \
            -PsigningPassword='${{ secrets.SIGNING_PASSWORD }}' \
            -PcentralPassword='${{ secrets.CENTRAL_PASSWORD }}' \
            -PcentralUsername='${{ secrets.CENTRAL_USERNAME }}'
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash/uploadToCentral.sh \
            -p '${{ secrets.CENTRAL_PASSWORD }}' \
            -u '${{ secrets.CENTRAL_USERNAME }}'

  Java25-Windows:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: windows-2025
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '25'
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build install javadoc --console=plain --stacktrace
        shell: bash

  Java27-MacOS:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macos-26-intel
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '27'
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build install javadoc TestIssue5253 --console=plain --stacktrace
