---
# GitHub Actions workflow for commits pushed to the MonkeyWrench repo - all branches

name: CI at GitHub
on: [push]

jobs:
  Java8-Linux:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 8
      - uses: actions/checkout@v7
      - run: ./gradlew build javadoc install TestIssue5253 --console=plain --stacktrace

  Java11-MacOSX_ARM64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macos-26
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 11
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - run: ./gradlew build javadoc install TestIssue5253 --console=plain --stacktrace

  Java17-MacOSX64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macos-26-intel
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: actions/checkout@v7
      - run: ./gradlew build javadoc install TestIssue5253 --console=plain --stacktrace

  Java21-Linux64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: actions/checkout@v7
      - run: |
          ./gradlew build javadoc install TestIssue5253 \
            --console=plain \
            -PsigningKeyEncoded='${{ secrets.SIGNING_KEY_ENCODED }}' \
            -PsigningPassword='${{ secrets.SIGNING_PASSWORD }}'
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./gradlew clean release \
            --console=plain \
            -PsigningKeyEncoded='${{ secrets.SIGNING_KEY_ENCODED }}' \
            -PsigningPassword='${{ secrets.SIGNING_PASSWORD }}' \
            -PcentralPassword='${{ secrets.CENTRAL_PASSWORD }}' \
            -PcentralUsername='${{ secrets.CENTRAL_USERNAME }}'
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash/uploadToCentral.sh \
            -p '${{ secrets.CENTRAL_PASSWORD }}' \
            -u '${{ secrets.CENTRAL_USERNAME }}'

  Java24-Windows:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: windows-2025
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 24
      - uses: actions/checkout@v7
      - run: ./gradlew build javadoc install --console=plain --stacktrace
        shell: bash
